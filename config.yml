backend:
  name: git-gateway
  branch: main

# Allows editorial workflow (draft → review → publish)
publish_mode: editorial_workflow

# Where media uploads go (images for blog posts)
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Site URL for previews
site_url: https://tpmtrailco.netlify.app

collections:
  # ── BLOG POSTS ──────────────────────────────────────────────
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}} · {{date}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - label: "Trail Stories"
        field: category
        pattern: "Trail Stories"
      - label: "Ecology"
        field: category
        pattern: "Ecology"
      - label: "Gear"
        field: category
        pattern: "Gear"
    fields:
      - label: "Post Title"
        name: "title"
        widget: "string"
        hint: "The headline shown on the blog grid and inside the article"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "🥾 Trail Stories", value: "Trail Stories" }
          - { label: "🌿 Ecology", value: "Ecology" }
          - { label: "🎒 Gear", value: "Gear" }
        hint: "Choose the content pillar this post belongs to"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "MMMM D, YYYY"
        date_format: "MMMM D, YYYY"
        time_format: false
        hint: "The date shown on the post card"

      - label: "Read Time"
        name: "readTime"
        widget: "string"
        default: "5 min read"
        hint: "Estimated reading time e.g. '5 min read'"

      - label: "Featured Post"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Toggle on to show this post as the large featured card at the top of the blog"

      - label: "Short Excerpt"
        name: "excerpt"
        widget: "text"
        hint: "2–3 sentences shown on the blog card preview. Keep it punchy."

      - label: "Tags"
        name: "tags"
        widget: "list"
        allow_add: true
        hint: "Add relevant tags e.g. Trail History, Plant Medicine, Gear, Beginner Tips"
        field:
          label: "Tag"
          name: "tag"
          widget: "string"

      - label: "Card Background Color"
        name: "gradient"
        widget: "select"
        default: "linear-gradient(135deg, #1c3a28 0%, #2d5a3d 40%, #4a7c59 100%)"
        options:
          - label: "Forest Green (default)"
            value: "linear-gradient(135deg, #1c3a28 0%, #2d5a3d 40%, #4a7c59 100%)"
          - label: "Deep Pine"
            value: "linear-gradient(135deg, #0d2018 0%, #1c3a28 40%, #2d5a3d 100%)"
          - label: "Sage & Fern"
            value: "linear-gradient(135deg, #2d5a3d 0%, #4a7c59 60%, #7aaa85 100%)"
          - label: "Earth & Clay"
            value: "linear-gradient(135deg, #3d2b1f 0%, #6b4c35 50%, #c4956a 100%)"
          - label: "Bark & Sand"
            value: "linear-gradient(135deg, #6b4c35 0%, #c4956a 60%, #e8d5b7 100%)"
          - label: "Midnight Forest"
            value: "linear-gradient(135deg, #0d2018 0%, #1c3a28 100%)"
        hint: "Background color shown on the blog post card"

      - label: "Article Body"
        name: "body"
        widget: "markdown"
        hint: "Write your full article here. Use headings, bold, bullet points — all supported."
        modes:
          - rich_text
          - raw

  # ── SITE SETTINGS ───────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "_data/settings.json"
        fields:
          - label: "Site Name"
            name: "site_name"
            widget: "string"
            default: "TPM Trail Co."

          - label: "Tagline"
            name: "tagline"
            widget: "string"
            default: "The People's Medicine — New England"

          - label: "Booking Email"
            name: "booking_email"
            widget: "string"
            default: "james.companyy@gmail.com"

          - label: "Instagram Handle"
            name: "instagram"
            widget: "string"
            default: "@tpmtrailco"

          - label: "TikTok Handle"
            name: "tiktok"
            widget: "string"
            default: "@tpmtrailco"

          - label: "Season Open"
            name: "season_open"
            widget: "string"
            default: "May"

          - label: "Season Close"
            name: "season_close"
            widget: "string"
            default: "November"
